<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3ecf8e">
<title>Schnupperkurs Verwaltung</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--primary:#3ecf8e;--primary-dark:#2ba871;--bg:#f8fafc;--surface:#ffffff;--text:#0f172a;--text-light:#64748b;--border:#e2e8f0;--shadow:0 4px 6px -1px rgba(0,0,0,.1);--radius:12px}
[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--text-light:#94a3b8;--border:#334155}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark))}
.login-box{background:var(--surface);border-radius:var(--radius);padding:30px;max-width:400px;width:100%;box-shadow:var(--shadow)}
.login-title{font-size:1.8rem;font-weight:700;text-align:center;margin-bottom:20px;color:var(--primary-dark)}
.input-group{margin-bottom:16px}
.input-label{display:block;margin-bottom:6px;font-weight:600;font-size:.875rem}
.input-field{width:100%;padding:12px;border:2px solid var(--border);border-radius:8px;font-size:1rem;background:var(--surface);color:var(--text)}
.input-field:focus{outline:none;border-color:var(--primary)}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:var(--surface);color:var(--text);border:2px solid var(--border);margin-top:10px}
.btn-sm{padding:8px 12px;font-size:.875rem;width:auto}
.btn-danger{background:#ef4444;color:white}
.header{background:var(--primary);color:white;padding:16px 20px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.nav{background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;display:flex;padding:8px;gap:4px}
.nav-btn{flex:1;min-width:90px;padding:10px;background:none;border:none;color:var(--text-light);font-weight:600;cursor:pointer;border-radius:6px;white-space:nowrap}
.nav-btn.active{background:rgba(62,207,142,.1);color:var(--primary)}
.main{max-width:1200px;margin:0 auto;padding:20px}
.tab-content{display:none}.tab-content.active{display:block}
.card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--surface);padding:20px;border-radius:var(--radius);box-shadow:var(--shadow);text-align:center}
.stat-value{font-size:2rem;font-weight:700;color:var(--primary)}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.item-header{display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px}
.item-title{font-weight:700;font-size:1.1rem}
.item-meta{font-size:.875rem;color:var(--text-light);margin-top:4px}
.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:.75rem;font-weight:600}
.badge-success{background:rgba(16,185,129,.1);color:#10b981}
.badge-gray{background:rgba(100,116,139,.1);color:#64748b}
.badge-primary{background:rgba(62,207,142,.1);color:var(--primary)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--surface);border-radius:var(--radius);max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);color:var(--text);padding:12px 20px;border-radius:8px;box-shadow:var(--shadow);z-index:2000;transform:translateX(150%);transition:transform .3s;border-left:4px solid var(--primary)}
.toast.show{transform:translateX(0)}
.toast.error{border-left-color:#ef4444}
.hidden{display:none!important}
.flex{display:flex}.gap-2{gap:8px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}
.checkbox-list{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:8px}
.checkbox-item{display:flex;align-items:center;padding:8px;border-bottom:1px solid var(--border)}
.checkbox-item input{width:18px;height:18px;margin-right:10px;accent-color:var(--primary)}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photo-item{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.photo-item img{width:100%;height:100%;object-fit:cover}
.empty-state{text-align:center;padding:40px;color:var(--text-light)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1 class="login-title">Schnupperkurs</h1>
    <div id="loginStep1">
      <div class="input-group">
        <label class="input-label">Zugangscode</label>
        <!-- HIER IST DER FIX: autocomplete="off" und kein sichtbarer Standard-Code -->
        <input type="password" id="startCode" class="input-field" placeholder="Code eingeben" autocomplete="off" inputmode="numeric">
      </div>
      <button class="btn btn-primary" onclick="checkCode()">Weiter</button>
    </div>
    <div id="loginStep2" class="hidden">
      <div class="input-group">
        <label class="input-label">Dein Name</label>
        <input type="text" id="userName" class="input-field" placeholder="Max Mustermann">
      </div>
      <button class="btn btn-primary" onclick="registerUser()">Profil anlegen & starten</button>
      <button class="btn btn-secondary" onclick="showStep(1)">Zurück</button>
    </div>
    <div id="loginStep3" class="hidden">
      <button class="btn btn-primary" onclick="loginExisting()">Anmelden</button>
      <button class="btn btn-secondary" onclick="resetLogin()">Anderes Gerät / neuer Nutzer</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="header">
    <h1 style="font-size:1.2rem"><i class="fas fa-clipboard-list"></i> Schnupperkurs</h1>
    <div class="flex gap-2">
      <span id="userDisplay" style="font-size:.9rem"></span>
      <button class="btn btn-sm" style="background:rgba(255,255,255,.2);color:white" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
    </div>
  </header>

  <nav class="nav">
    <button class="nav-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">Übersicht</button>
    <button class="nav-btn" data-tab="kinder" onclick="switchTab('kinder')">Kinder</button>
    <button class="nav-btn" data-tab="schuhe" onclick="switchTab('schuhe')">Schuhe</button>
    <button class="nav-btn" data-tab="training" onclick="switchTab('training')">Training</button>
    <button class="nav-btn" data-tab="fotos" onclick="switchTab('fotos')">Fotos</button>
    <button class="nav-btn" data-tab="emails" onclick="switchTab('emails')">E-Mails</button>
    <button class="nav-btn" data-tab="passwoerter" onclick="switchTab('passwoerter')">Passwörter</button>
  </nav>

  <main class="main">
    <section id="tab-dashboard" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="statKinder">0</div><div>Kinder</div></div>
        <div class="stat-card"><div class="stat-value" id="statTermine">0</div><div>Termine</div></div>
        <div class="stat-card"><div class="stat-value" id="statFotos">0</div><div>Fotos</div></div>
      </div>
      <div class="card">
        <h3>Willkommen!</h3>
        <p class="mt-2">Verwalte Kinder, Termine, Schuhe, Fotos und E-Mails zentral.</p>
      </div>
    </section>

    <section id="tab-kinder" class="tab-content">
      <div class="card">
        <div class="flex gap-2" style="flex-wrap:wrap;margin-bottom:16px">
          <button class="btn btn-sm btn-primary" onclick="openKindModal()">+ Kind</button>
          <label class="btn btn-sm btn-secondary" style="cursor:pointer">
            CSV Import <input type="file" id="kinderImport" accept=".csv" onchange="importKinder(event)" style="display:none">
          </label>
          <button class="btn btn-sm btn-secondary" onclick="exportKinder()">Export</button>
        </div>
        <input type="text" id="kinderSuche" class="input-field" placeholder="Suchen..." oninput="renderKinder()">
      </div>
      <div id="kinderListe"></div>
    </section>

    <section id="tab-schuhe" class="tab-content">
      <div class="card"><h3>Schlittschuhe</h3><p class="item-meta mt-2">Größen und Nummern werden automatisch aus den Kinderdaten übernommen.</p></div>
      <div id="schuheListe"></div>
    </section>

    <section id="tab-training" class="tab-content">
      <div class="card">
        <div class="flex gap-2"><h3>Termine</h3><button class="btn btn-sm btn-primary" onclick="openTerminModal()">+ Termin</button></div>
      </div>
      <div id="termineListe"></div>
    </section>

    <section id="tab-fotos" class="tab-content">
      <div class="card">
        <label class="btn btn-sm btn-primary" style="cursor:pointer">
          Fotos hochladen <input type="file" id="fotoUpload" accept="image/*" multiple onchange="uploadFotos(event)" style="display:none">
        </label>
      </div>
      <div class="photo-grid" id="fotoGrid"></div>
    </section>

    <section id="tab-emails" class="tab-content">
      <div class="card">
        <div class="flex gap-2"><h3>E-Mails</h3><button class="btn btn-sm btn-primary" onclick="openEmailModal()">+ Neu</button></div>
      </div>
      <div id="emailListe"></div>
    </section>

    <section id="tab-passwoerter" class="tab-content">
      <div class="card">
        <div class="flex gap-2"><h3>Passwörter</h3><button class="btn btn-sm btn-primary" onclick="openPwModal()">+ Eintrag</button></div>
      </div>
      <div id="pwListe"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// 1. SUPABASE CONFIG
const SUPABASE_URL = 'https://teakdwkipibnlncoftko.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlYWtkd2tpcGZpYm5sbmNmdGtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDA5MDYsImV4cCI6MjEwNTMxNjkwNn0.9969Tp4Oy2TRwDJnGO68jyUda0wt2LXj33jrWudSKaI';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 2. SICHERER CODE (Base64 von "1344")
const _codeHash = 'MTM0NA==';

let kinder=[], termine=[], fotos=[], emails=[], passwoerter=[];

// 3. AUTH & LOGIN
function initAuth(){
  const saved = localStorage.getItem('ecg_name');
  if(saved) { showStep(3); } else { showStep(1); }
}

function showStep(n){
  document.getElementById('loginStep1').classList.add('hidden');
  document.getElementById('loginStep2').classList.add('hidden');
  document.getElementById('loginStep3').classList.add('hidden');
  document.getElementById('loginStep'+n).classList.remove('hidden');
}

window.checkCode = function(){
  const input = document.getElementById('startCode').value.trim();
  const correct = atob(_codeHash); // Dekodiert zu "1344"
  if(input === correct){
    showStep(2);
  } else {
    showToast('Falscher Code!', 'error');
  }
};

window.registerUser = function(){
  const name = document.getElementById('userName').value.trim();
  if(!name) return showToast('Bitte Namen eingeben!', 'error');
  localStorage.setItem('ecg_name', name);
  startApp();
};

window.loginExisting = function(){ startApp(); };
window.resetLogin = function(){ localStorage.removeItem('ecg_name'); location.reload(); };
window.logout = function(){ localStorage.removeItem('ecg_name'); location.reload(); };

function startApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userDisplay').textContent = localStorage.getItem('ecg_name');
  initApp();
}

// 4. APP INITIALISIERUNG
async function initApp(){
  await initDefaultTermine();
  loadDaten();
  document.getElementById('kinderSuche').addEventListener('input', () => renderKinder());
}

async function initDefaultTermine(){
  const {data} = await supabase.from('termine').select('id').limit(1);
  if(data && data.length > 0) return;
  await supabase.from('termine').insert([
    {datum:'2026-11-02', uhrzeit:'17:00', titel:'Vortreffen', ort:'Eisstadion Grefrath', info:'Pflicht', typ:'pflicht'},
    {datum:'2026-11-11', titel:'1. Termin', typ:'normal'},
    {datum:'2026-11-18', titel:'2. Termin', typ:'normal'},
    {datum:'2026-11-25', titel:'3. Termin', typ:'normal'},
    {datum:'2026-12-02', titel:'4. Termin', typ:'normal'},
    {titel:'Nikolaus-Lauf', info:'Termin folgt – freiwillig', typ:'freiwillig'}
  ]);
}

async function loadDaten(){
  const {data: k} = await supabase.from('kinder').select('*').order('name'); kinder = k || [];
  const {data: t} = await supabase.from('termine').select('*').order('datum'); termine = t || [];
  const {data: f} = await supabase.from('fotos').select('*').order('created_at', {ascending:false}); fotos = f || [];
  const {data: e} = await supabase.from('emails').select('*').order('created_at', {ascending:false}); emails = e || [];
  const {data: p} = await supabase.from('passwoerter').select('*').order('dienst'); passwoerter = p || [];
  
  renderKinder(); renderSchuhe(); renderTermine(); renderFotos(); renderEmails(); renderPasswoerter();
  document.getElementById('statKinder').textContent = kinder.length;
  document.getElementById('statTermine').textContent = termine.length;
  document.getElementById('statFotos').textContent = fotos.length;
}

window.switchTab = function(tab){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-'+tab));
};

// 5. KINDER & CSV IMPORT (EXAKT NACH DEINER DATEI)
function renderKinder(){
  const q = document.getElementById('kinderSuche').value.toLowerCase();
  const filtered = kinder.filter(k => !q || (k.name||'').toLowerCase().includes(q) || (k.eltern_vorname||'').toLowerCase().includes(q));
  const list = document.getElementById('kinderListe');
  if(!filtered.length) { list.innerHTML = '<div class="empty-state">Keine Kinder gefunden</div>'; return; }
  
  list.innerHTML = filtered.map(k => `
    <div class="item">
      <div class="item-header">
        <div>
          <div class="item-title">${esc(k.name)}</div>
          <div class="item-meta"><i class="fas fa-users"></i> ${esc(k.eltern_vorname)} ${esc(k.eltern_nachname)}</div>
          <div class="item-meta"><i class="fas fa-envelope"></i> ${esc(k.email)} | <i class="fas fa-phone"></i> ${esc(k.telefon)}</div>
          ${k.einschraenkungen ? `<div class="item-meta" style="color:#f59e0b"><i class="fas fa-exclamation-triangle"></i> ${esc(k.einschraenkungen)}</div>` : ''}
        </div>
        <span class="badge ${k.fotoeinwilligung==='Ja'?'badge-success':'badge-gray'}">${k.fotoeinwilligung==='Ja'?'Foto OK':'Kein Foto'}</span>
      </div>
      <div class="mt-3 flex gap-2">
        <button class="btn btn-sm btn-secondary" onclick="openKindModal('${k.id}')">Bearbeiten</button>
        <button class="btn btn-sm btn-danger" onclick="deleteKind('${k.id}')">Löschen</button>
      </div>
    </div>
  `).join('');
}

window.importKinder = async function(e){
  const file = e.target.files[0]; if(!file) return;
  try {
    const text = await file.text();
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if(lines.length < 2) throw new Error('CSV ist leer');
    const sep = lines[0].includes(';') ? ';' : ',';
    const headers = lines[0].split(sep).map(h => h.trim().replace(/^"|"$/g, ''));
    
    const toInsert = lines.slice(1).map(line => {
      const cells = line.split(sep);
      const r = {};
      headers.forEach((h, i) => { r[h] = (cells[i] || '').trim().replace(/^"|"$/g, ''); });
      
      const vorname = r['Kind Vorname'] || '';
      const nachname = r['Kind Nachname'] || '';
      if(!vorname && !nachname) return null;
      
      return {
        kind_vorname: vorname,
        kind_nachname: nachname,
        name: (vorname + ' ' + nachname).trim(),
        status: r['Status'] || 'Angemeldet',
        alter: r['Alter'] ? parseInt(r['Alter']) : null,
        schuhgroesse: r['Schuhgröße'] || '',
        eltern_vorname: r['Eltern Vorname'] || '',
        eltern_nachname: r['Eltern Nachname'] || '',
        email: r['E-Mail'] || '',
        telefon: r['Telefon'] || '',
        einschraenkungen: r['Einschränkungen / Verhalten'] || '',
        fotoeinwilligung: r['Fotoeinwilligung'] || 'Nein'
      };
    }).filter(Boolean);

    if(toInsert.length > 0) {
      const {error} = await supabase.from('kinder').insert(toInsert);
      if(error) throw error;
      showToast(toInsert.length + ' Kinder importiert!');
      loadDaten();
    }
  } catch(err) {
    showToast('Fehler: ' + err.message, 'error');
  }
  e.target.value = '';
};

window.exportKinder = function(){
  const csv = [['Status','Kind Vorname','Kind Nachname','Alter','Schuhgröße','Eltern Vorname','Eltern Nachname','E-Mail','Telefon','Einschränkungen / Verhalten','Fotoeinwilligung'],
    ...kinder.map(k => [k.status, k.kind_vorname, k.kind_nachname, k.alter, k.schuhgroesse, k.eltern_vorname, k.eltern_nachname, k.email, k.telefon, k.einschraenkungen, k.fotoeinwilligung])
  ].map(r => r.map(c => `"${c||''}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kinder.csv'; a.click();
};

window.deleteKind = async function(id){
  if(!confirm('Wirklich löschen?')) return;
  await supabase.from('kinder').delete().eq('id', id);
  loadDaten(); showToast('Gelöscht');
};

function openKindModal(id=null){
  const k = id ? kinder.find(x => x.id === id) : {};
  createModal(id?'Kind bearbeiten':'Kind hinzufügen', `
    <div class="input-group"><label class="input-label">Vorname</label><input id="m_vor" class="input-field" value="${esc(k.kind_vorname||'')}"></div>
    <div class="input-group"><label class="input-label">Nachname</label><input id="m_nach" class="input-field" value="${esc(k.kind_nachname||'')}"></div>
    <div class="flex gap-2">
      <div class="input-group" style="flex:1"><label class="input-label">Alter</label><input id="m_alt" type="number" class="input-field" value="${k.alter||''}"></div>
      <div class="input-group" style="flex:1"><label class="input-label">Schuhgröße</label><input id="m_schuh" class="input-field" value="${esc(k.schuhgroesse||'')}"></div>
    </div>
    <div class="flex gap-2">
      <div class="input-group" style="flex:1"><label class="input-label">Eltern Vorname</label><input id="m_ev" class="input-field" value="${esc(k.eltern_vorname||'')}"></div>
      <div class="input-group" style="flex:1"><label class="input-label">Eltern Nachname</label><input id="m_en" class="input-field" value="${esc(k.eltern_nachname||'')}"></div>
    </div>
    <div class="input-group"><label class="input-label">E-Mail</label><input id="m_mail" class="input-field" value="${esc(k.email||'')}"></div>
    <div class="input-group"><label class="input-label">Telefon</label><input id="m_tel" class="input-field" value="${esc(k.telefon||'')}"></div>
    <div class="input-group"><label class="input-label">Einschränkungen</label><textarea id="m_einschr" class="input-field">${esc(k.einschraenkungen||'')}</textarea></div>
    <div class="input-group"><label class="input-label">Fotoeinwilligung</label><select id="m_foto" class="input-field"><option ${k.fotoeinwilligung==='Ja'?'selected':''}>Ja</option><option ${k.fotoeinwilligung!=='Ja'?'selected':''}>Nein</option></select></div>
  `, [
    {label:'Speichern', class:'btn-primary', onClick: async(m)=>{
      const data = {
        kind_vorname: document.getElementById('m_vor').value.trim(),
        kind_nachname: document.getElementById('m_nach').value.trim(),
        name: (document.getElementById('m_vor').value.trim() + ' ' + document.getElementById('m_nach').value.trim()).trim(),
        alter: document.getElementById('m_alt').value ? parseInt(document.getElementById('m_alt').value) : null,
        schuhgroesse: document.getElementById('m_schuh').value,
        eltern_vorname: document.getElementById('m_ev').value.trim(),
        eltern_nachname: document.getElementById('m_en').value.trim(),
        email: document.getElementById('m_mail').value.trim(),
        telefon: document.getElementById('m_tel').value.trim(),
        einschraenkungen: document.getElementById('m_einschr').value.trim(),
        fotoeinwilligung: document.getElementById('m_foto').value
      };
      if(id) await supabase.from('kinder').update(data).eq('id', id);
      else await supabase.from('kinder').insert(data);
      m.remove(); loadDaten(); showToast('Gespeichert');
    }},
    {label:'Abbrechen', class:'btn-secondary', onClick: (m)=>m.remove()}
  ]);
}

// 6. SCHUHE
function renderSchuhe(){
  const list = document.getElementById('schuheListe');
  if(!kinder.length) { list.innerHTML = '<div class="empty-state">Keine Kinder</div>'; return; }
  list.innerHTML = kinder.map(k => `
    <div class="item">
      <div class="item-title">${esc(k.name)}</div>
      <div class="flex gap-2 mt-2">
        <input class="input-field" placeholder="Schuhgröße" value="${esc(k.schuhgroesse||'')}" onchange="updateField('kinder','${k.id}','schuhgroesse',this.value)">
        <input class="input-field" placeholder="Schuh-Nr." value="${esc(k.schuh_nr||'')}" onchange="updateField('kinder','${k.id}','schuh_nr',this.value)">
      </div>
      <input class="input-field mt-2" placeholder="Info (z.B. Leihschuh)" value="${esc(k.schuh_info||'')}" onchange="updateField('kinder','${k.id}','schuh_info',this.value)">
    </div>
  `).join('');
}

// 7. TRAINING
function renderTermine(){
  const list = document.getElementById('termineListe');
  list.innerHTML = termine.map(t => {
    const anw = t.anwesenheit || {};
    const present = kinder.filter(k => anw[k.id]).length;
    return `
    <div class="card">
      <div class="item-header">
        <div>
          <div class="item-title">${esc(t.titel)} <span class="badge ${t.typ==='pflicht'?'badge-primary':'badge-gray'}">${t.typ}</span></div>
          <div class="item-meta">${t.datum||'Termin folgt'} ${t.uhrzeit?'| '+t.uhrzeit+' Uhr':''} ${t.ort?'| '+t.ort:''}</div>
        </div>
      </div>
      ${t.info?`<p class="mt-2">${esc(t.info)}</p>`:''}
      <div class="mt-3">
        <strong>Anwesenheit (${present}/${kinder.length})</strong>
        <div class="checkbox-list mt-2">
          ${kinder.map(k => `<label class="checkbox-item"><input type="checkbox" ${anw[k.id]?'checked':''} onchange="toggleAnw('${t.id}','${k.id}',this.checked)"> ${esc(k.name)}</label>`).join('')}
        </div>
      </div>
      <div class="mt-3 flex gap-2">
        <button class="btn btn-sm btn-secondary" onclick="openTerminModal('${t.id}')">Bearbeiten</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTermin('${t.id}')">Löschen</button>
      </div>
    </div>`;
  }).join('');
}

window.toggleAnw = async function(tid, kid, checked){
  const t = termine.find(x => x.id === tid);
  const anw = {...(t.anwesenheit||{})};
  if(checked) anw[kid] = true; else delete anw[kid];
  await supabase.from('termine').update({anwesenheit: anw}).eq('id', tid);
  loadDaten();
};

window.deleteTermin = async function(id){
  if(!confirm('Löschen?')) return;
  await supabase.from('termine').delete().eq('id', id);
  loadDaten(); showToast('Gelöscht');
};

function openTerminModal(id=null){
  const t = id ? termine.find(x => x.id === id) : {};
  createModal('Termin', `
    <div class="input-group"><label class="input-label">Titel</label><input id="m_titel" class="input-field" value="${esc(t.titel||'')}"></div>
    <div class="flex gap-2">
      <div class="input-group" style="flex:1"><label class="input-label">Datum</label><input id="m_datum" type="date" class="input-field" value="${t.datum||''}"></div>
      <div class="input-group" style="flex:1"><label class="input-label">Uhrzeit</label><input id="m_uhr" class="input-field" value="${esc(t.uhrzeit||'')}"></div>
    </div>
    <div class="input-group"><label class="input-label">Ort</label><input id="m_ort" class="input-field" value="${esc(t.ort||'')}"></div>
    <div class="input-group"><label class="input-label">Typ</label><select id="m_typ" class="input-field"><option ${t.typ==='normal'?'selected':''}>normal</option><option ${t.typ==='pflicht'?'selected':''}>pflicht</option><option ${t.typ==='freiwillig'?'selected':''}>freiwillig</option></select></div>
    <div class="input-group"><label class="input-label">Info</label><textarea id="m_info" class="input-field">${esc(t.info||'')}</textarea></div>
  `, [
    {label:'Speichern', class:'btn-primary', onClick: async(m)=>{
      const data = {titel:document.getElementById('m_titel').value, datum:document.getElementById('m_datum').value, uhrzeit:document.getElementById('m_uhr').value, ort:document.getElementById('m_ort').value, typ:document.getElementById('m_typ').value, info:document.getElementById('m_info').value};
      if(id) await supabase.from('termine').update(data).eq('id', id);
      else await supabase.from('termine').insert({...data, anwesenheit:{}});
      m.remove(); loadDaten(); showToast('Gespeichert');
    }},
    {label:'Abbrechen', class:'btn-secondary', onClick: (m)=>m.remove()}
  ]);
}

// 8. FOTOS
window.uploadFotos = async function(e){
  const files = [...e.target.files]; if(!files.length) return;
  const name = localStorage.getItem('ecg_name') || 'Unbekannt';
  for(const file of files){
    const path = Date.now() + '_' + file.name;
    await supabase.storage.from('fotos').upload(path, file);
    const {data:{publicUrl}} = supabase.storage.from('fotos').getPublicUrl(path);
    await supabase.from('fotos').insert({url: publicUrl, path, uploader_name: name});
  }
  loadDaten(); showToast('Fotos hochgeladen');
  e.target.value = '';
};

function renderFotos(){
  const grid = document.getElementById('fotoGrid');
  grid.innerHTML = fotos.map(f => `<div class="photo-item" onclick="window.open('${f.url}')"><img src="${f.url}" loading="lazy"><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:white;padding:4px;font-size:.75rem">${esc(f.uploader_name)}</div></div>`).join('');
}

// 9. E-MAILS & PASSWÖRTER (Vereinfacht für Stabilität)
function renderEmails(){
  document.getElementById('emailListe').innerHTML = emails.map(m => `
    <div class="item">
      <div class="item-title">${esc(m.betreff||'Kein Betreff')} ${m.entwurf?'<span class="badge badge-gray">Entwurf</span>':''}</div>
      <div class="item-meta">Von: ${esc(m.von)} | An: ${esc(m.an)}</div>
      <p class="mt-2">${esc(m.text||'')}</p>
      <div class="mt-2 flex gap-2">
        <button class="btn btn-sm btn-danger" onclick="supabase.from('emails').delete().eq('id','${m.id}').then(()=>loadDaten())">Löschen</button>
      </div>
    </div>
  `).join('') || '<div class="empty-state">Keine E-Mails</div>';
}

function openEmailModal(){
  createModal('Neue E-Mail', `
    <div class="input-group"><label class="input-label">Von</label><input id="m_von" class="input-field"></div>
    <div class="input-group"><label class="input-label">An</label><input id="m_an" class="input-field"></div>
    <div class="input-group"><label class="input-label">Betreff</label><input id="m_betreff" class="input-field"></div>
    <div class="input-group"><label class="input-label">Text</label><textarea id="m_text" class="input-field" style="min-height:100px"></textarea></div>
  `, [{label:'Speichern', class:'btn-primary', onClick: async(m)=>{
    await supabase.from('emails').insert({von:document.getElementById('m_von').value, an:document.getElementById('m_an').value, betreff:document.getElementById('m_betreff').value, text:document.getElementById('m_text').value});
    m.remove(); loadDaten(); showToast('Gespeichert');
  }}, {label:'Abbrechen', class:'btn-secondary', onClick: (x)=>x.remove()}]);
}

function renderPasswoerter(){
  document.getElementById('pwListe').innerHTML = passwoerter.map(p => `
    <div class="item">
      <div class="item-title">${esc(p.dienst)}</div>
      <div class="item-meta">Login: <span style="font-family:monospace">${esc(p.login)}</span></div>
      <div class="item-meta">Passwort: <span id="pw_${p.id}" style="font-family:monospace;filter:blur(4px)">${esc(p.passwort)}</span> <button class="btn btn-sm" onclick="document.getElementById('pw_${p.id}').style.filter='none'" style="width:auto;padding:2px 6px">👁</button></div>
      <button class="btn btn-sm btn-danger mt-2" onclick="supabase.from('passwoerter').delete().eq('id','${p.id}').then(()=>loadDaten())">Löschen</button>
    </div>
  `).join('') || '<div class="empty-state">Keine Passwörter</div>';
}

function openPwModal(){
  createModal('Passwort', `
    <div class="input-group"><label class="input-label">Dienst</label><select id="m_dienst" class="input-field"><option>Yahoo</option><option>ChatGPT</option><option>Claude</option><option>Sonstiges</option></select></div>
    <div class="input-group"><label class="input-label">Login</label><input id="m_login" class="input-field"></div>
    <div class="input-group"><label class="input-label">Passwort</label><input id="m_pass" type="password" class="input-field"></div>
  `, [{label:'Speichern', class:'btn-primary', onClick: async(m)=>{
    await supabase.from('passwoerter').insert({dienst:document.getElementById('m_dienst').value, login:document.getElementById('m_login').value, passwort:document.getElementById('m_pass').value});
    m.remove(); loadDaten(); showToast('Gespeichert');
  }}, {label:'Abbrechen', class:'btn-secondary', onClick: (x)=>x.remove()}]);
}

// 10. HILFSFUNKTIONEN
function createModal(title, content, actions){
  const m = document.createElement('div'); m.className = 'modal-overlay';
  m.innerHTML = `<div class="modal"><div class="modal-header"><h3>${title}</h3><button onclick="this.closest('.modal-overlay').remove()" style="background:none;border:none;font-size:1.5rem;cursor:pointer">×</button></div><div class="modal-body">${content}</div><div class="modal-footer">${actions.map(a=>`<button class="btn btn-sm ${a.class}" data-act="${a.label}">${a.label}</button>`).join('')}</div></div>`;
  actions.forEach(a => m.querySelector(`[data-act="${a.label}"]`).addEventListener('click', () => a.onClick(m)));
  m.addEventListener('click', e => { if(e.target === m) m.remove(); });
  document.body.appendChild(m);
}

window.showToast = function(msg, type=''){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
};

window.updateField = async function(table, id, field, value){
  await supabase.from(table).update({[field]: value}).eq('id', id);
  showToast('Aktualisiert');
};

function esc(t){ const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; }

// START
initAuth();
</script>
